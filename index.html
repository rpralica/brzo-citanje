<!DOCTYPE html>
<html lang="bs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Brzo citanje</title>
  
</head>

<body>

  <h1>Brzo citanje - brojac, generator, tajmer</h1>

  <div class="row">
    <button onclick="toggleControls()" id="toggleBtn" style="font-size:18px;">Sakrij kontrole</button>
  </div>

  <div class="box">
    <div id="controlsTop">
      <div class="row">
        <span class="label">Font:</span>
        <button onclick="changeFont(-1)">A-</button>
        <span id="fontSizeLabel">18</span>
        <button onclick="changeFont(1)">A+</button>
        <button onclick="resetFont()">Reset</button>
      </div>

      <div class="row">
        <span class="label">Broj rijeci za generisanje:</span>
        <input type="number" id="genWords" value="600">
        <button onclick="generateText()">Generisi</button>
      </div>

      <div class="row">
        <span class="label">Ucitaj .txt fajl:</span>
        <input type="file" id="fileInput" accept=".txt,text/plain" onchange="loadTextFile(event)">
      </div>
    </div>

    <textarea id="textArea" oninput="updateCount()" onkeyup="updateCount()"></textarea>

    <div class="row info" id="countLabel">Rijeci: 0 Karaktera: 0</div>

    <div id="controlsBottom">
      <div class="row">
        <button onclick="clearText()">Clear</button>
        <button onclick="countSelection()">Prebroji selektovano</button>
        <span class="info" id="selectionLabel">Selektovano rijeci: 0</span>
      </div>

      <div class="row">
        <button onclick="savePosition()">Sacuvaj poziciju (dokle sam stao)</button>
        <button onclick="goToSavedPosition()">Idi na sacuvanu poziciju</button>
        <span class="info" id="positionLabel"></span>
      </div>
    </div>
  </div>

  <div class="col2-wrap" id="controlsTimers">
   
 <div class="box">
  <div style="margin-bottom: 1em;" class="label">Izracun WPM (rijeci u minuti)</div>
  <div class="row">
    <span class="label" style="display:inline-block; width:110px;">Br. rijeci:</span>
    <input id="wpmRijeci" value="0" type="number" style="width:80px;">
  </div>
  <div class="row">
    <span class="label" style="display:inline-block; width:110px;">Min</span>
    <input id="min" value="0"  type="number" style="width:80px;">
    <label for=""><strong>Sek</strong></label>
    <input id="sek" value="0"  type="number">
  </div>
  <div class="row">
    <span class="label" style="display:inline-block; width:110px;">Rezultat:</span>
    <input id="wpmRez" type="number" style="width:80px;" readonly>
  </div>
  <button readonly  id="wpmBtn" >Izracunaj</button>
</div>

  </div>

<div class="col2-left">
  <div class="box">
    <div class="label">Tajmer (countdown)</div>
    <div class="row">
      Min: <input type="number" id="timerMin" value="1" style="width:40px;">
      Sek: <input type="number" id="timerSec" value="0" style="width:40px;">
    </div>
    <div class="row">
      <span class="timer-display" id="timerDisplay">01:00</span>
    </div>
    <div class="row">
      <button onclick="timerStart()">Start</button>
      <button onclick="timerPause()">Pauza</button>
      <button onclick="timerReset()">Reset</button>
    </div>
  </div>
</div>

<div class="col2-right">
  <div class="box">
    <div class="label">Stoperica</div>
    <div class="row">
      <span class="timer-display" id="stopwatchDisplay">00:00</span>
    </div>
    <div class="row">
      <button onclick="stopwatchStart()">Start</button>
      <button onclick="stopwatchPause()">Pauza</button>
      <button onclick="stopwatchReset()">Reset</button>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>

</html>
